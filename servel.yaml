domain: agentkarma.io

# Verified archive reads; dRPC now rejects historical ranges above ~100 blocks.
env:
    ARC_RPC_URL: https://rpc.testnet.arc.io
    ARC_MAINNET_RPC_URL: https://rpc.mainnet.arc.io
    # In-cluster Supabase gateway (agentkarma-db binding alias). Server queries
    # skip the Cloudflare round trip: 30-65 ms vs 130-400 ms per query.
    SUPABASE_INTERNAL_URL: http://kong:8000

infra:
    - name: agentkarma-db
