name: Bun setup
description: >
  Checkout-adjacent Bun toolchain setup shared by every scheduled workflow:
  pinned runtime, warm install cache, authenticated + retried `bun install`.

  Each piece closes a failure mode that took the floor down on 2026-08-17:

  1. PINNED VERSION — `bun-version: latest` makes setup-bun call the GitHub tag
     API on every run; a 504 there killed two Stellar refreshes. A pinned
     version skips the call entirely and makes setup-bun's binary cache hit.
  2. INSTALL CACHE — `@selfxyz/*` pulls two dependencies straight from GitHub
     tarballs (`github:remicolin/forge`, `github:sampritipanda/snarkjs`). With a
     cold cache every job re-downloads them from codeload.github.com; when runs
     cluster, codeload answers 429 and the whole job dies before the real work
     starts. A warm cache serves them with zero network.
  3. GITHUB_TOKEN — codeload rate-limits *unauthenticated* tarball fetches far
     more aggressively. The run's own token lifts the cold-cache path over the
     limit (verified: the same fetch that 429s anonymously succeeds with it).
  4. RETRY — cold cache plus a transient 429 must not page. Three attempts with
     backoff, then fail loudly: a genuinely broken install still breaks the run.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        # Pin, don't track `latest` — see (1) above. Bump deliberately.
        bun-version: 1.3.14

    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        # A stale-lockfile cache still holds the git tarballs, which are pinned
        # to commit hashes and therefore never invalidated by a lockfile bump.
        restore-keys: bun-install-${{ runner.os }}-

    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        for attempt in 1 2 3; do
          if bun install --frozen-lockfile; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            delay=$((attempt * 20))
            echo "::warning::bun install failed (attempt ${attempt}/3) — retrying in ${delay}s"
            sleep "$delay"
          fi
        done
        echo "::error::bun install failed after 3 attempts"
        exit 1
