name: Heartbeat drain

# Dead Man's Switch liveness floor (all chains). Derives succession liveness from
# each declared agent's last meaningful tx and emits Tier-2 heartbeat signals.
# Runs entirely on GitHub's runner so it works even when the web app or its
# in-process heartbeat worker is wedged — the defense-in-depth twin of the
# in-process worker (see the 2026-05/06 ingest-freshness incident; servel cron
# is non-functional on this cluster). AK never executes a will — observe only.
#
# Required repo secrets:
#   NEXT_PUBLIC_SUPABASE_URL   DB endpoint
#   SUPABASE_SERVICE_ROLE_KEY  DB writes

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 min
  workflow_dispatch:
    inputs:
      chain:
        description: 'Restrict to one chain (blank = all chains)'
        type: string
        default: ''

concurrency:
  group: heartbeat-drain
  cancel-in-progress: false

jobs:
  heartbeat-drain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bun-setup

      - name: Run heartbeat drain
        id: drain
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Pass the input via env (never interpolate ${{ }} into the shell).
          CHAIN: ${{ inputs.chain }}
        # The drain is idempotent (derives liveness from on-chain state), so a
        # transient DB/RPC timeout is retried before the run is called failed.
        run: |
          args=()
          [ -n "$CHAIN" ] && args=(--chain "$CHAIN")
          for attempt in 1 2 3; do
            bun run heartbeat:drain "${args[@]}" && exit 0
            [ "$attempt" -lt 3 ] && { echo "::warning::heartbeat:drain attempt ${attempt}/3 failed, retrying in 60s"; sleep 60; }
          done
          exit 1

      # A broken floor must page, not rot silently (2026-06-23 outage lesson).
      # Page only on the 2nd consecutive failed run: a one-off blip (a Cloudflare
      # 522 on the DB endpoint, 2026-10-19) self-heals by the next run and is
      # not worth a phone alert. Real outages still page one run later.
      - name: Alert gate
        id: gate
        if: always()
        uses: ./.github/actions/alert-gate
        with:
          github-token: ${{ github.token }}
          workflow: heartbeat-drain.yml
          failed: ${{ steps.drain.outcome != 'success' }}
          min-consecutive: '2'
          reminder-every: '6'

      - name: Page on failure
        if: always() && steps.gate.outputs.page == 'true'
        uses: ./.github/actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          text: |
            🛟 <b>AgentKarma heartbeat-drain FLOOR FAILED</b>
            The out-of-process Dead Man's Switch liveness floor crashed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
