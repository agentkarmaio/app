name: Arc attest

# Gives AgentKarma's Arc attestation drip a running cadence.
#
# Arc is chain #4's production network: gas is USDC itself (18-decimal
# native view), one attestation costs cents-scale, and the validator wallet was
# funded with 1 USDC at registration (~0.004 measured for register(), 2026-09-25).
# The pool of eligible agents is small (~226 mirrored at launch) and grows with
# the registry scanner, so a small daily drip compounds.
#
# Sibling of celo-attest.yml, and deliberately NOT a shared workflow: the chains
# fail differently (USDC gas vs CELO, official public RPC vs default viem RPC).
#
# ARMING — the scheduled run SIMULATES until both are set:
#
#   Repository variable  ARC_MAINNET_ATTEST_ENABLED          = true
#   Repository secret    ARC_MAINNET_VALIDATOR_PRIVATE_KEY = the validator key (0x…)
#
# Unarmed, the daily run still exercises the whole path — balance preflight,
# coverage, stratified sampling, the live already-rated read, and a real
# eth_estimateGas for every candidate write — and fails loudly if any of it
# breaks. viem simulates against an address, so no key is needed for that.
#
# Concurrency is MANDATORY: two overlapping runs would both sample from the same
# unrated pool and could rate the same agent twice.
#
# Required repo secrets:
#   NEXT_PUBLIC_SUPABASE_URL   target selection + coverage (registry mirror)
#   SUPABASE_SERVICE_ROLE_KEY  target selection + coverage
# Optional repo secrets:
#   ARC_MAINNET_VALIDATOR_PRIVATE_KEY  signing key — required only once armed
#   ARC_MAINNET_RPC_URL                RPC override (falls back to the official public RPC)
#   TELEGRAM_BOT_TOKEN, TELEGRAM_ALERT_CHAT_ID   failure alerts

on:
  schedule:
    - cron: '45 6 * * *' # daily 06:45 UTC — 30m after the 06:15 celo-attest,
                         # clear of the 05:30 stellar-refresh, the 05:45
                         # stellar-attest, the 6h keep-fresh slots (00/06/12/18)
                         # and the 03:15 solana registry scan.
  workflow_dispatch:
    inputs:
      execute:
        description: 'Write to Arc (unchecked = simulate)'
        type: boolean
        default: false
      count:
        description: 'Max attestations to publish this run'
        type: string
        default: '3'

concurrency:
  group: arc-mainnet-attest
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bun-setup

      # The script refuses below the USDC balance floor, refuses any write
      # above the fee ceiling before signing, skips AK's own agent (228) and
      # anything it has already rated, and publishes only at or above the score
      # floor — see scripts/arc-mainnet-batch-feedback.ts. A manual dispatch is
      # always explicit: it executes only when the box is ticked, regardless of
      # the arming variable.
      - name: Publish metadata-quality attestations
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARC_MAINNET_RPC_URL: ${{ secrets.ARC_MAINNET_RPC_URL }}
          ARC_MAINNET_VALIDATOR_PRIVATE_KEY: ${{ secrets.ARC_MAINNET_VALIDATOR_PRIVATE_KEY }}
          EVENT: ${{ github.event_name }}
          ARMED: ${{ vars.ARC_MAINNET_ATTEST_ENABLED }}
          DISPATCH_EXECUTE: ${{ inputs.execute }}
          COUNT: ${{ inputs.count }}
        run: |
          set -euo pipefail
          # A dispatch input reaches a shell here, so it is validated rather
          # than interpolated: an unchecked value like "3 --execute" would arm
          # a run nobody armed.
          COUNT="${COUNT:-3}"
          case "$COUNT" in
            ''|*[!0-9]*) echo "::error::count must be a positive integer, got '$COUNT'"; exit 1 ;;
          esac
          EXEC=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "${DISPATCH_EXECUTE:-false}" = "true" ]; then EXEC="--execute"; fi
          elif [ "${ARMED:-}" = "true" ]; then
            EXEC="--execute"
          else
            echo "::notice::ARC_MAINNET_ATTEST_ENABLED is not 'true' — simulating. Set the repo variable to arm the drip."
          fi
          echo "running: arc-mainnet-batch-feedback --count $COUNT $EXEC"
          bun run scripts/arc-mainnet-batch-feedback.ts --count "$COUNT" $EXEC

      # Reasons this pages: the validator wallet is running dry, the RPC is
      # unusable, or a giveFeedback target errored. None of them should rot
      # silently — a drip nobody notices has stopped is what this job exists to
      # catch.
      #
      # Gas above the fee ceiling is NOT one of them: that gate refuses before
      # signing, so the script logs "BLOCKED" and exits 0. Nor is a missing
      # signing key — the unarmed run only simulates, and resolves the signer
      # address from the disclosed validator constant.
      - name: Page on failure
        if: failure()
        uses: ./.github/actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          text: |
            🛟 <b>AgentKarma arc-mainnet-attest FAILED</b>
            Read the "FAILED:" line in the log — it names each target and its error.
            Arc writes get a receipt, so nothing half-landed: it is safe to re-run once the cause is fixed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}