name: Chain indexing recovery

# App-independent recovery; shared database leases prevent overlap with the
# five-minute application workers. Each path fails independently.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: indexing-recovery
  cancel-in-progress: false

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chain: arc, path: escrow }
          # arc/transfers is deliberately absent. The lease stops two runs
          # overlapping, but not the two competing for the same Arc RPC quota,
          # and on this path that quota is the binding constraint: after
          # f6a277d the five-minute worker drains ~6M blocks of backlog and
          # every run it lands is throttle-bound (2026-09-14: per-run yield
          # fell 50k → 20k → 10k blocks as error_code went budget →
          # rate_limited). The hourly leg loses that race, reports
          # checkedCount 0, and pages `stalled` while the worker beside it is
          # banking rows — so it spent quota to manufacture a false alarm
          # about the very path it was slowing down. Recovery here means
          # leaving the worker alone. Restore this entry only if the worker
          # stops covering the path.
          - { chain: arc, path: registry }
          - { chain: arc-mainnet, path: transfers }
          - { chain: arc-mainnet, path: registry }
          - { chain: celo, path: payments }
          - { chain: stellar, path: transfers }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-setup
      - name: Run bounded indexing path
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARC_RPC_URL: ${{ vars.ARC_RPC_URL }}
          ARC_JOBS_START_BLOCK: ${{ vars.ARC_JOBS_START_BLOCK }}
          ARC_TRANSFERS_START_BLOCK: ${{ vars.ARC_TRANSFERS_START_BLOCK }}
          ARC_MAINNET_RPC_URL: ${{ secrets.ARC_MAINNET_RPC_URL || 'https://rpc.mainnet.arc.io' }}
          ARC_MAINNET_TRANSFERS_START_BLOCK: ${{ vars.ARC_MAINNET_TRANSFERS_START_BLOCK }}
          ARC_MAINNET_SEED_ADDRESSES: ${{ vars.ARC_MAINNET_SEED_ADDRESSES }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
          STELLAR_HORIZON_URL: ${{ secrets.STELLAR_HORIZON_URL }}
          CHAIN: ${{ matrix.chain }}
          INDEXING_PATH: ${{ matrix.path }}
        run: bun run src/scripts/indexing-run.ts "$CHAIN" "$INDEXING_PATH"
      - name: Page on failure
        if: failure()
        uses: ./.github/actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          text: |
            AgentKarma indexing recovery failed: ${{ matrix.chain }}/${{ matrix.path }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
