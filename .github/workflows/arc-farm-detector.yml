name: Arc farm detector

# Weekly observability job for Arc Testnet's permissionless ERC-8004 registry +
# ERC-8183 escrow, which are farmable (bulk-minted templated identities,
# self-farmed feedback, wash-traded settlements — see project_arc_registry_synthetic
# memory, 2026-07-03/07-08). Alert-only: never blocks ingestion or writes to the
# DB. Replaces the manual, ad-hoc investigation that produced that memory with
# a repeatable, scheduled check. See
# docs/superpowers/specs/2026-07-11-arc-farm-detector-design.md.
#
# Required repo secrets:
#   NEXT_PUBLIC_SUPABASE_URL   \ isTemplatedCounterparty resolves an address to
#   SUPABASE_SERVICE_ROLE_KEY  / its arc_agent_id via the DB. The require-env
#                                preflight fails the run loudly at line 1 if
#                                unset — the 2026-07-13/07-20 runs died on this
#                                8 frames deep with no usable message.
# Alerting secrets (optional — no-ops with a warning if unset):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_ALERT_CHAT_ID
# Optional repo secret:
#   ARC_RPC_URL   RPC override; falls back to the public Arc Testnet RPC, which
#                 throttles hard — the script paces + backs off either way.

on:
  schedule:
    - cron: '0 9 * * 1' # weekly, Monday 09:00 UTC
  workflow_dispatch:

concurrency:
  group: arc-farm-detector
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bun-setup

      - name: Run farm detector
        id: detect
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run scripts/arc-farm-detector.ts

      - name: Alert on flagged ratios
        if: steps.detect.outputs.flagged == 'true'
        uses: ./.github/actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          text: ${{ steps.detect.outputs.summary }}

      # A crashed detector must page too — going silent defeats the whole point.
      - name: Page on detector failure
        if: failure()
        uses: ./.github/actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          text: |
            🛟 <b>AgentKarma arc-farm-detector FAILED</b>
            The Arc farm-signal sampling job crashed (RPC error?) — no farm-ratio check ran this week.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
