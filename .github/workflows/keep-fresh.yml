name: Keep data fresh

# Resilient, app-independent ingest floor. Re-enables the Helius webhook,
# polls facilitators for new x402 txs, and drains the scoring backlog —
# entirely from GitHub's runner, so it works even when the web app or its
# in-process workers are wedged (which is exactly how the 2026-05-21 → 06-06
# outage went unnoticed). servel cron is non-functional on this cluster.
#
# Required repo secrets:
#   HELIUS_RPC_URL              Helius RPC endpoint incl. ?api-key=… (used for
#                              RPC fetches AND webhook-API key extraction)
#   HELIUS_WEBHOOK_SECRET      MUST match the server's, so the re-enabled
#                              webhook's authHeader is accepted by the route
#   NEXT_PUBLIC_SUPABASE_URL   DB endpoint
#   SUPABASE_SERVICE_ROLE_KEY  DB writes
# Optional repo secret:
#   SOLANA_RPC_URL             Free standard RPC (e.g. https://solana-rpc.publicnode.com).
#                              When set, the indexer reads Solana via getParsedTransaction
#                              instead of the Helius Enhanced API — $0, quota-independent
#                              (getIndexerRpcUrl). Free RPCs lack deep signature history,
#                              so runs auto-switch to --backfill (incremental `until:<old
#                              sig>` errors "Transaction not found").

on:
  schedule:
    - cron: '0 */6 * * *' # every 6h
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Ignore cursors and backfill historical (one-off gap recovery)'
        type: boolean
        default: false

concurrency:
  group: keep-fresh
  cancel-in-progress: false

jobs:
  keep-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run keep-fresh
        env:
          # Optional free RPC → Helius-free ingestion. When set, the indexer reads
          # Solana through it (getParsedTransaction) instead of Helius credits.
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          HELIUS_WEBHOOK_SECRET: ${{ secrets.HELIUS_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Pass the input via env (never interpolate ${{ }} into the shell).
          BACKFILL: ${{ inputs.backfill }}
        run: |
          # A free SOLANA_RPC_URL means Helius-free, which REQUIRES --backfill
          # (free RPCs lack deep history for incremental `until` cursors) and a
          # capped per-facilitator limit (singular getParsedTransaction calls).
          if [ -n "$SOLANA_RPC_URL" ]; then
            bun run src/scripts/keep-fresh.ts --backfill --limit 100
          elif [ "$BACKFILL" = "true" ]; then
            bun run keep-fresh:backfill
          else
            bun run keep-fresh
          fi
