name: Keep data fresh

# Resilient, app-independent ingest floor. Re-enables the Helius webhook,
# polls facilitators for new x402 txs, and drains the scoring backlog —
# entirely from GitHub's runner, so it works even when the web app or its
# in-process workers are wedged (which is exactly how the 2026-05-21 → 06-06
# outage went unnoticed). servel cron is non-functional on this cluster.
#
# A second job (registry-scan) keeps the ERC-8004 Celo registry mirror the
# /celo page reads fresh with a cheap INCREMENTAL scan (new ids + a bounded
# recent re-scan window), replacing the manual `registry:scan`. It runs the
# scan DIRECTLY via bun with the DB secrets — same resilient pattern as the
# keep-fresh / heartbeat-drain jobs — NOT by curling the in-app cron route, so
# it cannot fail silently for a missing CRON_SECRET (the in-app cron route at
# /api/cron/registry-scan stays available for manual/external invocation). It
# uses only the two DB secrets below; the require-env preflight fails it loudly
# at line 1 if they are unset, and the if: failure() step pages.
#
# Required repo secrets:
#   HELIUS_RPC_URL              Helius RPC endpoint incl. ?api-key=… (used for
#                              RPC fetches AND webhook-API key extraction)
#   HELIUS_WEBHOOK_SECRET      MUST match the server's, so the re-enabled
#                              webhook's authHeader is accepted by the route
#   NEXT_PUBLIC_SUPABASE_URL   DB endpoint
#   SUPABASE_SERVICE_ROLE_KEY  DB writes
# Optional repo secret:
#   SOLANA_RPC_URL             Free standard RPC (e.g. https://solana-rpc.publicnode.com).
#                              When set, the indexer reads Solana via getParsedTransaction
#                              instead of the Helius Enhanced API — $0, quota-independent
#                              (getIndexerRpcUrl). Free RPCs lack deep signature history,
#                              so runs auto-switch to --backfill (incremental `until:<old
#                              sig>` errors "Transaction not found").
#   SOLANA_ARCHIVE_RPC_URL     Full-history RPC for transactions the endpoint above
#                              has already pruned (publicnode retains ~2 days).
#                              Unset → https://api.mainnet-beta.solana.com, so the
#                              archive retry works with no secret configured.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6h
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Ignore cursors and backfill historical (one-off gap recovery)'
        type: boolean
        default: false

concurrency:
  group: keep-fresh
  cancel-in-progress: false

jobs:
  keep-fresh:
    runs-on: ubuntu-latest
    # `actions: read` is what the alert gate needs to see how previous runs
    # ended. Declared per-job so the sibling registry-scan job keeps the default.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bun-setup

      - name: Run keep-fresh
        id: keep_fresh
        # Step-level, NOT job-level. A job that exceeds its own timeout-minutes
        # is CANCELLED, and `if: failure()` steps do not run on cancellation —
        # so a job-level timeout would silence the very page it exists to raise.
        # A step-level one fails the step and lets the alert step run.
        timeout-minutes: 20
        env:
          # Optional free RPC → Helius-free ingestion. When set, the indexer reads
          # Solana through it (getParsedTransaction) instead of Helius credits.
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SOLANA_ARCHIVE_RPC_URL: ${{ secrets.SOLANA_ARCHIVE_RPC_URL }}
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          HELIUS_WEBHOOK_SECRET: ${{ secrets.HELIUS_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Pass the input via env (never interpolate ${{ }} into the shell).
          BACKFILL: ${{ inputs.backfill }}
          # One-line verdict for the alert step: status, cause and counts.
          KEEP_FRESH_SUMMARY_FILE: ${{ runner.temp }}/keep-fresh-verdict.txt
        run: |
          # INCREMENTAL by default. This used to force --backfill whenever
          # SOLANA_RPC_URL was set, because a free RPC prunes its signature
          # history and a stored `until` cursor would age out into a permanent
          # -32020 wedge. That reason is gone: `getSignaturesWithCursorFallback`
          # re-anchors an unresolvable cursor (0953625) and the archive leg
          # resolves the ones the primary pruned, which is why the in-app worker
          # has run incremental against the same endpoint all along.
          #
          # Backfill re-fetched the newest ~100 signatures for every facilitator
          # on every run — ~1,000 receipts per run, of which the last five runs
          # before this change inserted 0, 0, 0, 1 and 0, because the webhook had
          # already banked them. It cannot close the real gaps either: those are
          # 59-81 days old and this endpoint retains ~2 days.
          #
          # The escape hatch stays: `workflow_dispatch` with backfill=true.
          if [ "$BACKFILL" = "true" ]; then
            bun run keep-fresh:backfill
          else
            bun run src/scripts/keep-fresh.ts --limit 100
          fi

      # Ping IndexNow (Bing/Yandex/Naver/…) with the agent + org pages whose
      # data this run just refreshed, so answer engines re-crawl fresh scores
      # in minutes. Reads the same sitemap the app serves; submits only URLs
      # changed in the overlap window (> the 6h cron). Bonus, not floor:
      # continue-on-error so a transient IndexNow 5xx never fails the job or
      # pages. Runs even after a keep-fresh failure (always) — whatever DID
      # change still gets announced.
      - name: Notify IndexNow of changed URLs
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run indexnow --since 12

      # A broken floor must page, not rot silently — the exact gap that let the
      # 2026-06-23 outage (secrets unset → 100% failure for weeks) go unnoticed.
      #
      # The script exits non-zero ONLY when the floor could not do its job: a
      # step threw, the scan did not complete, the lease was busy while nobody
      # had finished a scan, or freshness is unreadable/critical. What a
      # completed scan classified (unserved signatures, retained gaps,
      # `catching_up`) is disclosed on /api/v2/indexing/status and does NOT
      # page — keying the exit code on it produced 25 pages in nine days, 24 of
      # them while ingest was current to the minute.
      - name: Read the run's verdict
        id: verdict
        if: always()
        shell: bash
        run: |
          line="$(cat "${RUNNER_TEMP}/keep-fresh-verdict.txt" 2>/dev/null | head -1)"
          # No file means the script died before it could say anything.
          [ -n "$line" ] || line="[keep-fresh] verdict=PAGE why=\"no verdict written — the run died before reporting\""
          echo "line=${line}" >> "$GITHUB_OUTPUT"

      # `always()` + an explicit outcome check, not `if: failure()`: a step-level
      # timeout must still reach this step, and this phrasing does not depend on
      # how a given abort path is classified.
      # Page on the TRANSITION, not on every red run. A standing incident at a
      # 6-hourly cadence otherwise sends four identical messages a day, and the
      # fourth is read with as much attention as the third.
      - name: Alert gate
        id: gate
        if: always()
        uses: ./.github/actions/alert-gate
        with:
          github-token: ${{ github.token }}
          workflow: keep-fresh.yml
          failed: ${{ steps.keep_fresh.outcome != 'success' }}
          reminder-every: '4'

      - name: Page on failure
        if: always() && steps.gate.outputs.page == 'true'
        uses: ./.github/actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          text: |
            🛟 <b>AgentKarma keep-fresh FLOOR DEGRADED</b>
            The floor could not do its job this run.
            <code>${{ steps.verdict.outputs.line }}</code>
            Consecutive failed runs: ${{ steps.gate.outputs.streak }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Closing the loop matters as much as opening it: without this, the only
      # way to learn the floor came back is to notice the alerts stopping.
      - name: Note recovery
        if: always() && steps.gate.outputs.recovered == 'true'
        uses: ./.github/actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          text: |
            ✅ <b>AgentKarma keep-fresh recovered</b>
            <code>${{ steps.verdict.outputs.line }}</code>
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Incremental ERC-8004 Celo registry-mirror refresh — the /celo disclosure's
  # data source. Same resilient bun-script pattern as keep-fresh/heartbeat-drain
  # (DB secrets via env, require-env preflight, if: failure() alert) so it can't
  # fail silently. Cheap: scans new ids since the cursor + a recent re-scan
  # window, never the full ~9.6k-id / ~12-min sweep.
  registry-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bun-setup

      - name: Run incremental registry scan
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional RPC override; falls back to the config default when unset.
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
        run: bun run src/scripts/indexing-run.ts celo registry

      # A broken mirror refresh must page, not rot silently (2026-06-23 lesson).
      - name: Page on failure
        if: failure()
        uses: ./.github/actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          text: |
            🛟 <b>AgentKarma registry-scan FAILED</b>
            The Celo ERC-8004 registry-mirror refresh crashed — /celo data may stall.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
