name: Keep data fresh

# Resilient, app-independent ingest floor. Re-enables the Helius webhook,
# polls facilitators for new x402 txs, and drains the scoring backlog —
# entirely from GitHub's runner, so it works even when the web app or its
# in-process workers are wedged (which is exactly how the 2026-05-21 → 06-06
# outage went unnoticed). servel cron is non-functional on this cluster.
#
# Required repo secrets:
#   HELIUS_RPC_URL              Helius RPC endpoint incl. ?api-key=… (used for
#                              RPC fetches AND webhook-API key extraction)
#   HELIUS_WEBHOOK_SECRET      MUST match the server's, so the re-enabled
#                              webhook's authHeader is accepted by the route
#   NEXT_PUBLIC_SUPABASE_URL   DB endpoint
#   SUPABASE_SERVICE_ROLE_KEY  DB writes

on:
  schedule:
    - cron: '0 */6 * * *' # every 6h
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Ignore cursors and backfill historical (one-off gap recovery)'
        type: boolean
        default: false

concurrency:
  group: keep-fresh
  cancel-in-progress: false

jobs:
  keep-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run keep-fresh
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          HELIUS_WEBHOOK_SECRET: ${{ secrets.HELIUS_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Pass the input via env (never interpolate ${{ }} into the shell).
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            bun run keep-fresh:backfill
          else
            bun run keep-fresh
          fi
